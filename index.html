    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerador de tabuada</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <main class="game-panel">
            <p class="eyebrow">CENTRAL DE CÁLCULO</p>
            <h1>Gerador de tabuada</h1>
            <p class="description">Escolha um número para iniciar.</p>

            <div class="controls">
                <label for="numero-input">Digite um número</label>
                <div class="input-row">
                    <input type="number" id="numero-input" placeholder="Ex.: 5">
                    <button id="btn-gerar" type="button">Gerar tabuada</button>
                </div>
            </div>

            <div id="resultado-aqui" aria-live="polite"></div>
        </main>

    <script src="script.js"></script>
    </body>
    </html>
